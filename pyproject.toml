[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelined-lm"
version = "0.1.0"
description = "Untied four-stage pipelined language models with cross-trajectory state and KV access"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.11,<2.12"]

[tool.setuptools.packages.find]
include = ["pipelined_lm*"]
